name: Renovate Bot
on:
  schedule:
    - cron: '4 6 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: Enable Renovate debug logging
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Renovate repository access
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Add the RENOVATE_TOKEN repository secret before running Renovate.'
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY" --silent
      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: 44.173.1
        env:
          LOG_LEVEL: ${{ inputs.debug && 'debug' || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_EXIT_CODE_FOR_ERRORS: 'true'
