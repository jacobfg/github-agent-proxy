name: Homebrew bottles
on:
  pull_request:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homebrew-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # renovate: datasource=github-releases depName=isometry/gobottle
  GOBOTTLE_VERSION_PIN: v0.9.0
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  HOMEBREW_NO_ENV_HINTS: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: isometry/gobottle-setup@84e89fbdda871c4a0e31c81afeef9371e8089436
        with:
          version: ${{ env.GOBOTTLE_VERSION_PIN }}
      - name: Test before packaging
        run: |
          git --version
          gh --version
          test -z "$(gofmt -l notices.go cmd internal)"
          go test -race -count=1 -timeout=3m ./...
          go vet ./...
      - name: Select version and source
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=0.0.0
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            git merge-base --is-ancestor HEAD origin/main
            version="$RELEASE_TAG"
          fi
          # Pin source to the built commit; the query supplies Homebrew's version hint.
          source_url="https://github.com/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz?version=$version"
          curl --fail --location --retry 3 "$source_url" -o "$RUNNER_TEMP/source.tar.gz"
          source_sha="$(sha256sum "$RUNNER_TEMP/source.tar.gz" | cut -d ' ' -f 1)"
          {
            echo "GOBOTTLE_VERSION=$version"
            echo "GOBOTTLE_SOURCE_URL=$source_url"
            echo "GOBOTTLE_SOURCE_SHA256=$source_sha"
          } >> "$GITHUB_ENV"
      - name: Build Apple Silicon bottle and preview formula
        run: |
          gobottle build --output-dir bottles
          gobottle release --dry-run --input bottles/bottles.json > bottles/github-agent-proxy.rb
          gobottle push --dry-run --input bottles/bottles.json
      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-bottles
          path: bottles/
          if-no-files-found: error
          retention-days: 14

  install:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3
      - uses: actions/download-artifact@v8
        with:
          name: homebrew-bottles
          path: bottles/
      - name: Install and test the built bottle
        run: |
          test "$(uname -m)" = arm64
          formula=jacobfg/github-agent-proxy/github-agent-proxy
          brew tap jacobfg/github-agent-proxy "$PWD"
          tap_dir="$(brew --repository jacobfg/github-agent-proxy)"
          git -C "$tap_dir" remote set-url origin https://github.com/jacobfg/github-agent-proxy
          cp bottles/github-agent-proxy.rb "$tap_dir/Formula/github-agent-proxy.rb"
          if brew help trust >/dev/null 2>&1; then brew trust --formula "$formula"; fi
          brew style "$formula"
          # Test before publishing by seeding Homebrew's verified bottle cache.
          cache="$(brew --cache --force-bottle "$formula")"
          mkdir -p "$(dirname "$cache")"
          cp "$(jq -r '.bottles[0].path' bottles/bottles.json)" "$cache"
          brew install --force-bottle "$formula"
          brew test --verbose "$formula"
          brew info --json=v2 "$formula" | jq -e '.formulae[0].installed[0].poured_from_bottle == true'

  publish:
    if: github.ref_type == 'tag' && github.repository == 'jacobfg/github-agent-proxy'
    needs: [build, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: homebrew-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: isometry/gobottle-setup@84e89fbdda871c4a0e31c81afeef9371e8089436
        with:
          version: ${{ env.GOBOTTLE_VERSION_PIN }}
      - uses: actions/download-artifact@v8
        with:
          name: homebrew-bottles
          path: bottles/
      - name: Publish tested bottle and update same-repository tap
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOBOTTLE_VERSION: ${{ github.ref_name }}
        run: |
          gobottle push --input bottles/bottles.json --output json > pushed.json
          gobottle release --input pushed.json
