name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml is the single source of truth for the toolchain
      # and its components; rustup auto-installs from it (and Renovate's
      # rust-toolchain manager keeps it current).
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'
      - run: just verify

  # Build and smoke-test the image on a native runner per architecture. The
  # builder stage compiles for its host target, so each arch must be built on
  # its own runner rather than under emulation (see publish.yml).
  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: gap-smoke
          cache-from: type=gha,scope=test-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=test-${{ matrix.arch }}
      - name: Run container and smoke-test the policy
        run: |
          docker run --name gap-smoke -d -p 127.0.0.1:8443:8443 \
            -e GAP_GITHUB_TOKEN=dummy \
            -e GAP_OWNER_LOGIN=smoke-bot \
            -e GAP_ALLOWED_ORGS=myorg \
            gap-smoke
          for i in $(seq 1 30); do
            if docker exec gap-smoke /github-agent-proxy healthcheck; then break; fi
            sleep 1
          done
          ./scripts/smoke.sh http://127.0.0.1:8443
      - if: always()
        run: docker rm -f gap-smoke || true
